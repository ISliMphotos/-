<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Лист персонажа</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0908;color:#e8dcc8;font-family:Georgia,serif;min-height:100vh}
.app{max-width:900px;margin:0 auto}
.hdr{background:#17130e;border-bottom:1px solid #2e2214;padding:14px 16px 0;position:sticky;top:0;z-index:50}
.hdr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cname{font-size:1.4rem;font-weight:bold;color:#c9a84c;letter-spacing:.06em}
.lbadge{background:#1a1208;border:1px solid #c9a84c;color:#c9a84c;border-radius:4px;padding:2px 8px;font-size:.7rem;letter-spacing:.1em;white-space:nowrap}
.tabs{display:flex;margin-top:12px;overflow-x:auto}
.tbtn{padding:8px 12px;background:transparent;border:none;border-top:2px solid transparent;color:#7a6a52;cursor:pointer;font-size:.72rem;letter-spacing:.06em;white-space:nowrap;font-family:Georgia,serif}
.tbtn.on{background:#0a0908;border-top-color:#c9a84c;color:#c9a84c}
.cnt{padding:16px}
.card{background:#13110e;border:1px solid #242018;border-radius:8px;padding:14px;margin-bottom:12px}
.stitle{font-size:.62rem;letter-spacing:.18em;color:#7a6a52;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sline{flex:1;height:1px;background:linear-gradient(90deg,#2a2018,transparent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bwrap{height:6px;background:#1a1510;border-radius:4px;overflow:hidden;margin-top:4px}
.bfill{height:100%;border-radius:4px;transition:width .4s}
.hpnum{font-size:1.7rem;font-weight:bold}
.snum{font-size:1.4rem;font-weight:bold;color:#7ec8e3}
.inp{background:#0a0908;border:1px solid #3a2e1e;color:#e8dcc8;border-radius:4px;padding:6px 10px;font-size:.8rem;font-family:Georgia,serif;outline:none;width:100%}
.inp:focus{border-color:#c9a84c}
textarea.inp{resize:vertical;min-height:52px}
.btn{background:#1e1a12;border:1px solid #4a3a22;color:#c9a84c;border-radius:4px;padding:6px 11px;cursor:pointer;font-size:.73rem;font-family:Georgia,serif}
.btn:hover{background:#2a2218}
.bpri{background:#c9a84c;border:1px solid #c9a84c;color:#0a0908;border-radius:4px;padding:6px 11px;cursor:pointer;font-size:.73rem;font-weight:bold;font-family:Georgia,serif}
.bpri:hover{opacity:.85}
.bdng{background:#1f0a0a;border:1px solid #7a2020;color:#e05050;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:.68rem;font-family:Georgia,serif}
.bdng:hover{background:#2a0f0f}
.beq{border-radius:4px;padding:3px 9px;cursor:pointer;font-size:.66rem;font-family:Georgia,serif;border:1px solid;white-space:nowrap}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac{background:#0a0908;border:1px solid #242018;border-radius:6px;padding:10px;text-align:center}
.av-total{font-size:1.8rem;font-weight:bold;color:#c9a84c;line-height:1}
.al{font-size:.62rem;color:#7a6a52;letter-spacing:.1em;margin-top:2px}
.tg{display:inline-block;border-radius:3px;padding:2px 6px;font-size:.6rem;letter-spacing:.07em;border:1px solid}
.ir{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#0a0908;border:1px solid #242018;border-radius:6px;margin-bottom:6px}
.irc{flex-direction:column;align-items:flex-start;gap:4px}
.pc{background:#0a0908;border:1px solid #242018;border-radius:6px;padding:11px;margin-bottom:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#13110e;border:1px solid #3a2e1e;border-radius:10px;padding:22px;width:340px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mtitle{color:#c9a84c;font-size:.92rem;letter-spacing:.1em;margin-bottom:16px}
.fl{font-size:.62rem;color:#7a6a52;letter-spacing:.1em;display:block;margin-bottom:3px;margin-top:10px}
.row{display:flex;gap:6px;align-items:center}
.notif{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#13110e;border-radius:6px;padding:8px 16px;z-index:300;font-size:.78rem;pointer-events:none;letter-spacing:.05em;border:1px solid}
select.inp option{background:#13110e}
.cd{background:#0a0908;border:1px solid #3a2e1e;border-radius:6px;padding:11px 13px;text-align:right;margin-bottom:12px}
.cn{font-size:2.2rem;font-weight:bold;color:#e8dcc8;min-height:46px;letter-spacing:.05em;word-break:break-all}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cb{background:#1e1a12;border:1px solid #4a3a22;color:#e8dcc8;border-radius:6px;width:100%;height:44px;cursor:pointer;font-size:1rem;font-family:Georgia,serif}
.cb:hover{background:#2a2218}
.cb.cc{background:#1a1208;border-color:#4a3a22;color:#c9a84c}
.cb.cdmg{background:#2a0e0e;border-color:#7a2020;color:#e05050}
.cb.cdmg:hover{background:#381212}
.cb.chl{background:#0a1f0e;border-color:#1a5c2a;color:#27ae60}
.cb.chl:hover{background:#0d2a14}
.cb.cgadd{background:#1a1208;border-color:#7a5c1e;color:#c9a84c}
.cb.cgadd:hover{background:#221908}
.tgl{position:relative;width:36px;height:20px;cursor:pointer;display:inline-block}
.tgl input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:#1a1510;border:1px solid #4a3a22;border-radius:10px;transition:.2s}
.tsl:before{content:"";position:absolute;height:12px;width:12px;left:3px;top:3px;background:#7a6a52;border-radius:50%;transition:.2s}
.tgl input:checked+.tsl{background:#1a2a1a;border-color:#27ae60}
.tgl input:checked+.tsl:before{transform:translateX(16px);background:#27ae60}
.skill-group{margin-bottom:14px}
.sg-title{font-size:.65rem;letter-spacing:.15em;color:#7a6a52;text-transform:uppercase;padding:6px 0;border-bottom:1px solid #242018;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.text-row{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0a0908;border:1px solid #242018;border-radius:5px;margin-bottom:5px}
.quest-item{background:#0a0908;border:1px solid #242018;border-radius:6px;padding:10px 12px;margin-bottom:7px}
.quest-done{border-color:#27ae6044;opacity:.7}
.npc-item{background:#0a0908;border:1px solid #242018;border-radius:6px;padding:10px 12px;margin-bottom:7px}
.ach-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#0a0908;border:1px solid #242018;border-radius:6px;margin-bottom:6px}
.gold-num{font-size:1.8rem;font-weight:bold;color:#c9a84c}
.inv-sec-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#0d0b08;border:1px solid #2a2018;border-radius:6px;cursor:pointer;margin-bottom:6px}
.inv-sec-hdr:hover{background:#131008}
.inv-sec-title{font-size:.68rem;letter-spacing:.12em;color:#c9a84c;text-transform:uppercase}
.editable{border:none;background:transparent;color:#e8dcc8;font-family:Georgia,serif;font-size:.78rem;outline:none;width:100%;cursor:text}
.editable:focus{border-bottom:1px solid #c9a84c}
.alch-sect-hdr{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding-bottom:8px}
.alch-tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.alch-tbl th{background:#1a1510;color:#c9a84c;font-size:.65rem;letter-spacing:.1em;padding:6px 8px}
.alch-tbl td{padding:5px 8px;border-bottom:1px solid #1a1510;vertical-align:middle}
.alch-tbl tr:last-child td{border-bottom:none}
.srch-result{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0a0908;border:1px solid #242018;border-radius:4px;margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="hdr-top">
    <span class="cname" id="charNameDisp"></span>
    <span class="lbadge" id="lvlD">УР. 1</span>
    <span style="font-size:.55rem;color:#3a2e1e;margin-left:4px">v5</span>
    <button class="btn" onclick="saveCharacter()" style="margin-left:auto;background:#27ae60;border-color:#27ae60;color:#fff">💾 Сохранить</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="cnt" id="cnt"></div>
</div>
<div id="notifEl" class="notif" style="display:none"></div>
<div id="movl" class="ov" style="display:none" onclick="closeMod()"><div class="modal" onclick="event.stopPropagation()" id="mbox"></div></div>
<div id="hpcalc" class="ov" style="display:none" onclick="closeHpCalc()">
  <div class="modal" style="width:280px" onclick="event.stopPropagation()">
    <div class="mtitle">Здоровье</div>
    <div class="cd"><div class="cn" id="hpcnum">0</div><div style="font-size:.68rem;color:#7a6a52">Введите число</div></div>
    <div class="cg">
      <button class="cb" onclick="hcp('7')">7</button><button class="cb" onclick="hcp('8')">8</button><button class="cb" onclick="hcp('9')">9</button><button class="cb cc" onclick="hccl()">C</button>
      <button class="cb" onclick="hcp('4')">4</button><button class="cb" onclick="hcp('5')">5</button><button class="cb" onclick="hcp('6')">6</button><button class="cb cc" onclick="hcdl()">⌫</button>
      <button class="cb" onclick="hcp('1')">1</button><button class="cb" onclick="hcp('2')">2</button><button class="cb" onclick="hcp('3')">3</button><div></div>
      <button class="cb" style="grid-column:span 2" onclick="hcp('0')">0</button><div></div><div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px">
      <button class="cb cdmg" style="width:100%;height:48px;font-size:.7rem;border-radius:6px;line-height:1.3" onclick="hcApply('d')">Урон<br><span style="font-size:.58rem;opacity:.75">−броня</span></button>
      <button class="cb cdmg" style="width:100%;height:48px;font-size:.7rem;border-radius:6px;line-height:1.3;border-color:#ff6b6b" onclick="hcApply('p')">Урон<br><span style="font-size:.58rem;opacity:.75">сквозной</span></button>
      <button class="cb chl" style="width:100%;height:48px;font-size:.7rem;border-radius:6px" onclick="hcApply('h')">Лечение</button>
    </div>
    <button class="btn" style="width:100%;margin-top:7px;text-align:center" onclick="closeHpCalc()">Закрыть</button>
  </div>
</div>
<div id="goldcalc" class="ov" style="display:none" onclick="closeGoldCalc()">
  <div class="modal" style="width:280px" onclick="event.stopPropagation()">
    <div class="mtitle">Золото</div>
    <div class="cd"><div class="cn" id="gcnum">0</div><div style="font-size:.68rem;color:#7a6a52">Введите сумму</div></div>
    <div class="cg">
      <button class="cb" onclick="gcp('7')">7</button><button class="cb" onclick="gcp('8')">8</button><button class="cb" onclick="gcp('9')">9</button><button class="cb cc" onclick="gccl()">C</button>
      <button class="cb" onclick="gcp('4')">4</button><button class="cb" onclick="gcp('5')">5</button><button class="cb" onclick="gcp('6')">6</button><button class="cb cc" onclick="gcdl()">⌫</button>
      <button class="cb" onclick="gcp('1')">1</button><button class="cb" onclick="gcp('2')">2</button><button class="cb" onclick="gcp('3')">3</button><div></div>
      <button class="cb" style="grid-column:span 2" onclick="gcp('0')">0</button><div></div><div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px">
      <button class="cb cgadd" style="width:100%;height:44px;font-size:.82rem;border-radius:6px" onclick="gcApply('add')">+ Получить</button>
      <button class="cb cdmg" style="width:100%;height:44px;font-size:.82rem;border-radius:6px" onclick="gcApply('sub')">− Потратить</button>
    </div>
    <button class="btn" style="width:100%;margin-top:7px;text-align:center" onclick="closeGoldCalc()">Закрыть</button>
  </div>
</div>
<script>
const BACKEND_URL = 'https://dnd-sheet-backend-bejb.onrender.com';
let vkUser = null;

const AT={strength:"Сила",agility:"Ловкость",vitality:"Живучесть",intellect:"Интеллект",trade:"Торговля",talent:"Талант"};
const AI={strength:"⚔",agility:"◎",vitality:"♥",intellect:"◆",trade:"◉",talent:"★"};
const BT=["Броня","Максимум HP","Урон","Бонусный урон","Сила","Ловкость","Живучесть","Интеллект","Торговля","Талант","Мана"];

let S={
  name:"",level:1,exp:0,expNext:30,
  attributes:{strength:0,agility:0,vitality:0,intellect:0,trade:0,talent:0},
  currentHP:0,gold:0,
  backpackOn:false,backpackSlots:10,
  professionLimit:6,
  titles:[],
  specialProps:[],
  professions:[],
  skills:[],
  weapons:[],
  armors:[],
  accessories:[],
  alchItems:[],
  potions:[],
  misc:[],
  achievements:[],
  quests:[],
  npcs:[],
  globalItemDB:[],
  alchDB:[],
  alchInventory:[],
  procRecipes:[],
  alchRecipes:[],
  alchCircleRecipes:[],
  alchHistory:[],
  alchSuccessChance:100
};

// ── VK INTEGRATION ───────────────────────────────────────────────────────────

async function initApp() {
  try {
    vkBridge.send('VKWebAppInit');
    const info = await vkBridge.send('VKWebAppGetUserInfo');
    vkUser = info;
  } catch(e) {
    console.log('VK Bridge недоступен (локальный запуск):', e.message);
  }
  if (vkUser) await loadCharacter();
  render();
}

async function loadCharacter() {
  try {
    const res = await fetch(BACKEND_URL + '/api/character/vk/' + vkUser.id);
    if (res.ok) {
      const data = await res.json();
      if (data.character_data) Object.assign(S, data.character_data);
    }
  } catch(e) { console.log('Новый персонаж'); }
}

async function saveCharacter() {
  if (!vkUser) { ntf('Открой через VK!', '#e05050'); return; }
  try {
    const res = await fetch(BACKEND_URL + '/api/character/vk/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ vk_id: vkUser.id, character_data: S })
    });
    if (res.ok) {
      ntf('Сохранено!', '#27ae60');
    } else {
      const err = await res.json().catch(() => ({}));
      const msg = err.details || err.error || ('HTTP ' + res.status);
      ntf('Ошибка: ' + msg, '#e05050');
      console.error('Save error:', err);
    }
  } catch(e) {
    ntf('Нет связи с сервером', '#e05050');
    console.error('Network error:', e);
  }
}

setInterval(function(){ if(vkUser) saveCharacter(); }, 30000);

// ─────────────────────────────────────────────────────────────────────────────

let tab="char";
let invOpen={weapons:true,armors:true,accessories:true,alch:true,potions:true,misc:true};
let questsOpenDone=false,questsOpenActive=true;
let alchSectOpen={proc:true,recipes:true,circle:true,base:true,hist:true};
let alchReagentCount=2,alchCircleReagentCount=2;
let alchBaseSortCol="name",alchBaseSortDir=1,alchBaseSearch="";
let alchBaseGroupBy="",alchInvGroupBy="",alchInvSortBy="name",alchInvSortDir=1;
let hcv="",gcv="";

// ── DERIVED ──
const skBonus=n=>S.skills.filter(s=>s.bonusTarget===n).reduce((a,s)=>a+(+s.bonusValue||0),0);
const acBonus=n=>S.accessories.filter(a=>a.equipped&&a.bonusTarget===n).reduce((a,s)=>a+(+s.bonusValue||0),0);
const mhp=()=>S.attributes.vitality*5+S.attributes.strength*2+skBonus("Максимум HP")+acBonus("Максимум HP");
const arm=()=>(S.armors.find(a=>a.equipped)?.armorValue||0)+skBonus("Броня")+acBonus("Броня");
const invUsed=()=>S.weapons.length+S.armors.length+S.accessories.length+S.alchItems.length+S.potions.length+S.misc.length;
const imax=()=>15+(S.backpackOn?S.backpackSlots:0);

// ── UTILS ──
function ntf(m,c){c=c||"#c9a84c";const e=document.getElementById("notifEl");e.textContent=m;e.style.color=c;e.style.borderColor=c;e.style.display="block";clearTimeout(window._nt);window._nt=setTimeout(()=>e.style.display="none",2200);}
const closeMod=()=>document.getElementById("movl").style.display="none";
const openMod=h=>{document.getElementById("mbox").innerHTML=h;document.getElementById("movl").style.display="flex";};
const tg=(t,c)=>`<span class="tg" style="color:${c};border-color:${c};background:${c}18">${t}</span>`;
const eqBtn=(eq,fn)=>{const c=eq?"#27ae60":"#c9a84c",bg=eq?"#0d1f0d":"#1e1a12",bc=eq?"#27ae60":"#4a3a22";return`<button class="beq" style="color:${c};border-color:${bc};background:${bg}" onclick="${fn}">${eq?"Снять":"Надеть"}</button>`;};
const setTab=t=>{tab=t;render();};

// ── CALCULATORS ──
const openHpCalc=()=>{hcv="";document.getElementById("hpcnum").textContent="0";document.getElementById("hpcalc").style.display="flex";};
const closeHpCalc=()=>document.getElementById("hpcalc").style.display="none";
function hcp(d){if(hcv.length>=6)return;hcv+=d;document.getElementById("hpcnum").textContent=parseInt(hcv)||"0";}
function hccl(){hcv="";document.getElementById("hpcnum").textContent="0";}
function hcdl(){hcv=hcv.slice(0,-1);document.getElementById("hpcnum").textContent=hcv?parseInt(hcv):"0";}
function hcApply(t){
  const v=parseInt(hcv)||0;if(v<=0)return;
  if(t==="d"){const r=Math.max(0,v-arm());S.currentHP=Math.max(0,S.currentHP-r);ntf("Урон: "+v+" → после брони: "+r,"#e05050");}
  else if(t==="p"){const sk=skBonus("Броня")+acBonus("Броня");const r=Math.max(0,v-sk);S.currentHP=Math.max(0,S.currentHP-r);ntf("Сквозной: "+v+(sk>0?" → -"+sk+" навыки: "+r:""),"#e05050");}
  else{S.currentHP=Math.min(mhp(),S.currentHP+v);ntf("Исцеление: +"+v+" HP","#27ae60");}
  closeHpCalc();render();
}
const openGoldCalc=()=>{gcv="";document.getElementById("gcnum").textContent="0";document.getElementById("goldcalc").style.display="flex";};
const closeGoldCalc=()=>document.getElementById("goldcalc").style.display="none";
function gcp(d){if(gcv.length>=8)return;gcv+=d;document.getElementById("gcnum").textContent=parseInt(gcv)||"0";}
function gccl(){gcv="";document.getElementById("gcnum").textContent="0";}
function gcdl(){gcv=gcv.slice(0,-1);document.getElementById("gcnum").textContent=gcv?parseInt(gcv):"0";}
function gcApply(t){
  const v=parseInt(gcv)||0;if(v<=0)return;
  if(t==="add"){S.gold+=v;ntf("+"+v+" золота","#c9a84c");}
  else{S.gold=Math.max(0,S.gold-v);ntf("−"+v+" золота","#e67e22");}
  closeGoldCalc();render();
}

// ── GLOBAL ITEM DB ──
function addToGlobalDB(item){
  if(!S.globalItemDB.find(x=>x.name===item.name&&x.type===item.type))
    S.globalItemDB.push({id:"g"+Date.now(),...item});
}
function globalDBSearch(q,type){
  if(!q)return[];
  const ql=q.toLowerCase();
  return S.globalItemDB.filter(x=>x.name.toLowerCase().includes(ql)&&x.type===type).slice(0,8);
}
function renderSearchResults(q,type,elId,onClickFn){
  const el=document.getElementById(elId);
  if(!el)return;
  if(!q){el.innerHTML="";return;}
  const res=globalDBSearch(q,type);
  if(res.length===0){el.innerHTML='<div style="color:#7a6a52;font-size:.75rem;padding:4px">Не найдено — заполните форму ниже</div>';return;}
  el.innerHTML=res.map(r=>{
    const sub=(r.damage?'Урон: '+r.damage+(r.bonusDamage?' · '+r.bonusDamage:''):'')+
      (r.armorValue?'Броня: '+r.armorValue:'')+
      (r.bonusTarget?r.bonusTarget+': +'+r.bonusValue:'')+
      (r.property?' — '+r.property:'');
    return '<div class="srch-result">'
      +'<div><div style="font-size:.8rem;font-weight:bold">'+r.name+'</div>'
      +(sub?'<div style="font-size:.68rem;color:#7a6a52">'+sub+'</div>':'')
      +'</div>'
      +'<button class="btn" style="padding:3px 8px;font-size:.68rem;flex-shrink:0" onclick="'+onClickFn+'(\''+r.id+'\')">+ Добавить</button>'
      +'</div>';
  }).join("");
}

// ── ARMOR BREAKDOWN ──
function armorBreakdown(){
  const eq=S.armors.find(x=>x.equipped);
  const fa=eq?eq.armorValue:0,fs=skBonus("Броня"),fc=acBonus("Броня");
  if(!eq&&fs===0&&fc===0)return '<div style="font-size:.62rem;color:#5a4a35;margin-top:2px">нет доспеха</div>';
  let s='<div style="margin-top:3px">';
  if(fa>0)s+='<div style="font-size:.62rem;color:#7a6a52">'+eq.name+': <span style="color:#7ec8e3">'+fa+'</span></div>';

// ── ALCHEMY TAB ──
function alchLabel(it){return it?it.name+" [ур."+it.level+", "+it.attribute+"]":"?";}
function alchFind(id){return S.alchDB.find(x=>x.id===id);}
function alchTimePretty(ts){const d=new Date(ts);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");}
function alchLog(type,txt,extra){S.alchHistory.unshift({t:Date.now(),type,txt,extra:extra||""});if(S.alchHistory.length>200)S.alchHistory=S.alchHistory.slice(0,200);}

function alchQtyChange(dbId,delta){
  const it=alchFind(dbId);
  const entry=S.alchInventory.find(x=>x.dbId===dbId);
  if(!entry){if(delta>0){S.alchInventory.push({id:"ai"+Date.now(),dbId,qty:delta});alchLog("add","Добавлено",alchLabel(it));}}
  else{entry.qty=Math.max(0,entry.qty+delta);if(entry.qty===0){S.alchInventory=S.alchInventory.filter(x=>x.dbId!==dbId);alchLog("del","Убрано",alchLabel(it));}else alchLog("update","Изменено",alchLabel(it)+" → "+entry.qty);}
  // sync alchItems
  if(it){
    const mi=S.alchItems.findIndex(x=>x.name===it.name);
    const newQty=S.alchInventory.find(x=>x.dbId===dbId)?.qty||0;
    if(mi>=0){if(newQty===0)S.alchItems.splice(mi,1);else S.alchItems[mi].qty=newQty;}
    else if(newQty>0)S.alchItems.push({id:Date.now(),name:it.name,level:it.level,attribute:it.attribute,property:"",comment:"",qty:newQty});
  }
  render();
}

function alchProcessOne(dbId){
  const entry=S.alchInventory.find(x=>x.dbId===dbId),it=alchFind(dbId);
  if(!entry||entry.qty<=0||!it){ntf("Нет предмета","#e05050");return;}
  const recipe=S.procRecipes.find(r=>r.srcId===dbId);
  if(!recipe){ntf("Нет рецепта обработки","#e67e22");return;}
  const roll=Math.random()*100;
  entry.qty=Math.max(0,entry.qty-1);
  if(entry.qty===0)S.alchInventory=S.alchInventory.filter(x=>x.dbId!==dbId);
  if(roll<S.alchSuccessChance){
    const re=S.alchInventory.find(x=>x.dbId===recipe.resId);
    if(re)re.qty++;else S.alchInventory.push({id:"ai"+Date.now(),dbId:recipe.resId,qty:1});
    const res=alchFind(recipe.resId);
    alchLog("success","Успех",alchLabel(it)+" → "+alchLabel(res));
    ntf("Успех! "+alchLabel(it)+" → "+alchLabel(res),"#27ae60");
  }else{alchLog("error","Провал",alchLabel(it));ntf("Провал! Предмет потерян","#e05050");}
  render();
}

function alchCreate(idx,arr){
  const r=arr[idx],prod=alchFind(r.resultId);
  if(!prod){ntf("Предмет рецепта удалён","#e05050");return;}
  for(const rid of r.reagentIds){const e=S.alchInventory.find(x=>x.dbId===rid);if(!e||e.qty<=0){const it=alchFind(rid);ntf("Не хватает: "+alchLabel(it),"#e05050");return;}}
  const roll=Math.random()*100;
  for(const rid of r.reagentIds){const e=S.alchInventory.find(x=>x.dbId===rid);if(e){e.qty--;if(e.qty<=0)S.alchInventory=S.alchInventory.filter(x=>x.dbId!==rid);}}
  if(roll<S.alchSuccessChance){
    const re=S.alchInventory.find(x=>x.dbId===r.resultId);
    if(re)re.qty++;else S.alchInventory.push({id:"ai"+Date.now(),dbId:r.resultId,qty:1});
    alchLog("synth","Синтез успешен",alchLabel(prod));ntf("Синтез успешен: "+alchLabel(prod),"#27ae60");
  }else{alchLog("error","Синтез провалился",alchLabel(prod));ntf("Синтез провалился!","#e05050");}
  render();
}

function alchSortedFiltered(){
  let items=[...S.alchDB];
  if(alchBaseSearch)items=items.filter(x=>x.name.toLowerCase().includes(alchBaseSearch.toLowerCase())||x.attribute.toLowerCase().includes(alchBaseSearch.toLowerCase()));
  items.sort((a,b)=>alchBaseSortCol==="level"?alchBaseSortDir*(a.level-b.level):alchBaseSortCol==="attribute"?alchBaseSortDir*a.attribute.localeCompare(b.attribute,"ru"):alchBaseSortDir*a.name.localeCompare(b.name,"ru"));
  if(!alchBaseGroupBy)return [{groupKey:"",items}];
  const map={};items.forEach(i=>{const k=alchBaseGroupBy==="level"?String(i.level):i.attribute;map[k]=map[k]||[];map[k].push(i);});
  return Object.entries(map).map(([groupKey,items])=>({groupKey,items})).sort((a,b)=>alchBaseGroupBy==="level"?Number(a.groupKey)-Number(b.groupKey):a.groupKey.localeCompare(b.groupKey,"ru"));
}

function alchSect(key,title,inner){
  const open=alchSectOpen[key];
  return '<div class="card">'
    +'<div class="alch-sect-hdr" onclick="alchSectOpen.'+key+'=!alchSectOpen.'+key+';render()">'
    +'<div class="stitle" style="margin-bottom:0">'+title+'<div class="sline"></div></div>'
    +'<span style="color:#c9a84c">'+(open?"▲":"▼")+'</span></div>'
    +(open?inner:"")
    +'</div>';
}

function rAlch(){
  // build inv rows using string concat (no nested template literals)
  let invSorted=[...S.alchInventory];
  invSorted.sort((a,b)=>{
    const ia=alchFind(a.dbId),ib=alchFind(b.dbId);if(!ia||!ib)return 0;
    if(alchInvSortBy==="level")return alchInvSortDir*(ia.level-ib.level);
    if(alchInvSortBy==="attribute")return alchInvSortDir*ia.attribute.localeCompare(ib.attribute,"ru");
    if(alchInvSortBy==="qty")return alchInvSortDir*(a.qty-b.qty);
    return alchInvSortDir*ia.name.localeCompare(ib.name,"ru");
  });
  let invGroups;
  if(!alchInvGroupBy){invGroups=[{groupKey:"",items:invSorted}];}
  else{const m={};invSorted.forEach(e=>{const it=alchFind(e.dbId);const k=!it?"?":(alchInvGroupBy==="level"?String(it.level):it.attribute);m[k]=m[k]||[];m[k].push(e);});invGroups=Object.entries(m).map(([g,items])=>({groupKey:g,items})).sort((a,b)=>alchInvGroupBy==="level"?Number(a.groupKey)-Number(b.groupKey):a.groupKey.localeCompare(b.groupKey,"ru"));}

  const histInner='<div style="max-height:200px;overflow-y:auto;background:#0a0908;border:1px solid #242018;border-radius:6px;padding:8px">'+histHtml+'</div>';

  return invHeader
    +alchSect("proc","Рецепты обработки",procInner)
    +alchSect("recipes","Алхимические рецепты",alchInner)
    +alchSect("circle","Алхимический круг",circleInner)

function alchAddToDB(){
  const name=(document.getElementById("alchDbName")||{}).value?.trim();
  const level=parseInt((document.getElementById("alchDbLevel")||{}).value)||1;
  const attribute=(document.getElementById("alchDbAttr")||{}).value?.trim();
  if(!name||!attribute){ntf("Заполните все поля","#e05050");return;}
  if(S.alchDB.find(x=>x.name===name&&x.level===level&&x.attribute===attribute)){ntf("Уже есть в базе","#e67e22");return;}
  S.alchDB.push({id:"a"+Date.now(),name,level,attribute});
  alchLog("add","Добавлено в базу",name+" [ур."+level+", "+attribute+"]");
  ntf("Добавлено: "+name);render();
}
function alchDelFromDB(id){
  const it=alchFind(id);if(!it)return;
  S.alchDB=S.alchDB.filter(x=>x.id!==id);
  S.alchInventory=S.alchInventory.filter(x=>x.dbId!==id);
  S.procRecipes=S.procRecipes.filter(r=>r.srcId!==id&&r.resId!==id);
  S.alchRecipes=S.alchRecipes.filter(r=>r.resultId!==id&&!r.reagentIds.includes(id));
  S.alchCircleRecipes=S.alchCircleRecipes.filter(r=>r.resultId!==id&&!r.reagentIds.includes(id));
  alchLog("del","Удалён из базы",alchLabel(it));ntf("Удалено: "+it.name,"#e05050");render();
}
function saveProcRecipe(){
  const s=document.getElementById("procSrc"),r=document.getElementById("procRes");
  if(!s||!r)return;
  if(S.procRecipes.find(x=>x.srcId===s.value)){ntf("Рецепт уже есть","#e67e22");return;}
  S.procRecipes.push({srcId:s.value,resId:r.value});
  alchLog("recipe","Рецепт обработки сохранён","");ntf("Рецепт сохранён");render();
}
function saveAlchRecipe(type){
  const resId=(type==="circle"?document.getElementById("alchCircResId"):document.getElementById("alchResId"))?.value;
  const count=type==="circle"?alchCircleReagentCount:alchReagentCount;
  const prefix=type==="circle"?"alchCircReag_":"alchReag_";
  const reagentIds=[];
  for(let i=0;i<count;i++){const el=document.getElementById(prefix+i);if(el)reagentIds.push(el.value);}
  if(!resId||reagentIds.length<2){ntf("Выберите результат и реагенты","#e05050");return;}
  (type==="circle"?S.alchCircleRecipes:S.alchRecipes).push({resultId:resId,reagentIds});
  alchLog("recipe","Рецепт сохранён"+(type==="circle"?" (круг)":""),"");ntf("Рецепт сохранён");render();
}

function oAddNPC(){openMod('<div class="mtitle">Новый НПС</div><label class="fl">Имя</label><input class="inp" id="npc_n"><label class="fl">Заметки</label><textarea class="inp" id="npc_d"></textarea><div class="row" style="margin-top:16px"><button class="bpri" onclick="sNPC()">Добавить</button><button class="btn" onclick="closeMod()">Отмена</button></div>');}

function oEditNPC(id){var n=S.npcs.find(function(x){return x.id===id;});openMod('<div class="mtitle">Редактировать НПС</div><label class="fl">Имя</label><input class="inp" id="en_n" value="'+n.name+'"><label class="fl">Заметки</label><textarea class="inp" id="en_d">'+n.notes+'</textarea><div class="row" style="margin-top:16px"><button class="bpri" onclick="sEditNPC('+id+')">Сохранить</button><button class="btn" onclick="closeMod()">Отмена</button></div>');}
function sEditNPC(id){S.npcs=S.npcs.map(function(x){return x.id===id?Object.assign({},x,{name:document.getElementById("en_n").value,notes:document.getElementById("en_d").value}):x;});closeMod();ntf("НПС обновлён");render();}

initApp();
</script>
</body>
</html>
